<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAKERPRINCE Panel</title>
<style>
body{ margin:0; font-family:Arial; background:url("minecraft.jpg") center/cover no-repeat fixed; color:white; }
.overlay{ background:rgba(0,0,0,0.8); min-height:100vh; padding:20px; text-align:center; }
.card{ background:#222; border-radius:15px; padding:20px; margin-bottom:15px; border:1px solid #444; }
.status-box { font-size: 18px; margin-bottom: 10px; }
.online { color: #00ff7f; }
.offline { color: #ff4d4d; }
.btn-group button { padding:12px 20px; border:none; border-radius:8px; margin:5px; font-weight:bold; cursor:pointer; color:white; }
.start { background:#00c853; } .stop { background:#d50000; } .restart { background:#ffab00; }
.menu-grid { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
.menu-item { background:#333; padding:15px; border-radius:10px; }
</style>
</head>
<body>
<div class="overlay">
  <h2>🖥 HAKERPRINCE PANEL</h2>
  
  <div class="card">
    <div class="status-box">Status: <span id="statusText" class="offline">OFFLINE</span></div>
    <b id="sname">Server</b><br>
    <small id="ip">loading...</small>
  </div>

  <div class="card btn-group">
    <button class="start" onclick="controlServer('start')">START</button>
    <button class="stop" onclick="controlServer('stop') Terminate">STOP</button>
    <button class="restart" onclick="controlServer('restart')">RESTART</button>
  </div>

  <div class="menu-grid">
    <div class="menu-item">⚙ Config</div>
    <div class="menu-item">📜 Console</div>
    <div class="menu-item">📁 Files</div>
    <div class="menu-item">🧩 Plugins</div>
  </div>
</div>

<script>
const BACKEND_URL = "https://hakerprince-github-io-2.onrender.com"; 

async function controlServer(action) {
    const status = document.getElementById("statusText");
    status.innerText = action.toUpperCase() + "...";
    
    try {
        const response = await fetch(`${BACKEND_URL}/${action}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ server: "HakerPrince-1" })
        });
        const data = await response.json();
        alert(data.message);
        
        if(action === 'start') { status.innerText = "ONLINE"; status.className = "online"; }
        if(action === 'stop') { status.innerText = "OFFLINE"; status.className = "offline"; }
    } catch (e) {
        alert("Backend Offline! Render ko jagne mein 1 min lagta hai.");
        status.innerText = "OFFLINE";
    }
}

// Name Logic
let saved = localStorage.getItem("serverName") || "HakerPrince";
document.getElementById("sname").innerText = saved;
document.getElementById("ip").innerText = saved.toLowerCase() + ".godvoid.host";
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Minecraft Server Panel</title>

<style>
body{
  margin:0;
  background:#0f1720;
  font-family:Arial, sans-serif;
  color:white;
}

/* top bar */
.top{
  background:#1c2733;
  padding:15px;
  font-size:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.server-box{
  background:#253240;
  margin:15px;
  padding:15px;
  border-radius:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.status{
  width:12px;
  height:12px;
  background:red;
  border-radius:50%;
}

/* menu */
.menu{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:15px;
}

.item{
  background:#2f3e4d;
  padding:15px;
  border-radius:12px;
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
}

.item:hover{
  background:#3a4c5f;
}

/* full width */
.full{
  grid-column:1 / -1;
}

/* bottom bar */
.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#1c2733;
  display:flex;
  justify-content:space-around;
  padding:10px 0;
  font-size:14px;
}
</style>
</head>

<body>

<div class="top">
  <div>Server</div>
  <div>My Servers</div>
</div>

<div class="server-box">
  <div>
    <b>MC_Godfire</b><br>
    <small>#xuBPFJgFwFb35Pl</small>
  </div>
  <div class="status"></div>
</div>

<div class="menu">
  <div class="item">🔌 Server</div>
  <div class="item">⚙️ Options</div>

  <div class="item">💻 Console</div>
  <div class="item">📄 Log <span style="color:red;">4</span></div>

  <div class="item">👥 Players</div>
  <div class="item">🧩 Software</div>

  <div class="item">🔌 Plugins</div>
  <div class="item">📁 Files</div>

  <div class="item">🌍 Worlds</div>
  <div class="item">💾 Backups</div>

  <div class="item full">🔐 Access</div>
</div>

<div class="bottom">
  <div>❓ Help</div>
  <div>⏻ Server</div>
  <div>👤 Account</div>
</div>

</body>
</html>

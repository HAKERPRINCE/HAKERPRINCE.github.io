<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Minecraft Server Panel</title>

<style>
body{
  margin:0;
  background:#1b232c;
  font-family:Arial, sans-serif;
  color:white;
}

/* TOP BAR */
.top{
  background:#2a3540;
  padding:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

/* SERVER BOX */
.server-box{
  background:#34414e;
  margin:12px;
  padding:14px;
  border-radius:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.status{
  width:12px;
  height:12px;
  background:red;
  border-radius:50%;
}

/* INPUT */
input{
  background:#1b232c;
  border:none;
  color:white;
  padding:6px;
  border-radius:6px;
  width:140px;
}

/* MENU */
.menu{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:12px;
}

.item{
  background:#3d4b59;
  padding:14px;
  border-radius:10px;
  display:flex;
  align-items:center;
  gap:10px;
}

.full{
  grid-column:1 / -1;
}

/* BOTTOM BAR */
.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#2a3540;
  display:flex;
  justify-content:space-around;
  padding:10px 0;
  font-size:14px;
}
</style>
</head>

<body>

<!-- TOP -->
<div class="top">
  <div>Server</div>
  <div>My Servers</div>
</div>

<!-- SERVER INFO -->
<div class="server-box">
  <div>
    <b id="serverName">Server</b><br>
    <small>#Auto-ID</small><br><br>

    <!-- NAME CHANGE -->
    <input type="text" id="nameInput" placeholder="Server name">
    <button onclick="changeName()">Save</button>
  </div>

  <div class="status" id="status"></div>
</div>

<!-- MENU -->
<div class="menu">
  <div class="item">🔌 Server</div>
  <div class="item">⚙️ Options</div>

  <div class="item">💻 Console</div>
  <div class="item">📄 Log</div>

  <div class="item">👥 Players</div>
  <div class="item">🧩 Software</div>

  <div class="item">🔌 Plugins</div>
  <div class="item">📁 Files</div>

  <div class="item">🌍 Worlds</div>
  <div class="item">💾 Backups</div>

  <div class="item full">🔐 Access</div>
</div>

<!-- BOTTOM -->
<div class="bottom">
  <div>❓ Help</div>
  <div>⏻ Server</div>
  <div>👤 Account</div>
</div>

<script>
/* LOAD SAVED NAME */
let savedName = localStorage.getItem("serverName");
if(savedName){
  document.getElementById("serverName").innerText = savedName;
}

/* CHANGE NAME */
function changeName(){
  let name = document.getElementById("nameInput").value;
  if(name){
    document.getElementById("serverName").innerText = name;
    localStorage.setItem("serverName", name);
  }
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Minecraft Server Panel</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background: url("minecraft.jpg") center/cover no-repeat fixed;
  color:white;
}

.overlay{
  background: rgba(0,0,0,0.75);
  min-height:100vh;
  padding:20px;
}

.header{
  text-align:center;
  font-size:22px;
  margin-bottom:20px;
}

.card{
  background:#1e1e1e;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
}

.server-name{
  font-size:18px;
  font-weight:bold;
}

input{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  border:none;
}

button{
  padding:10px 15px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
  margin:5px;
}

.start{background:#00c853;}
.stop{background:#d50000;}
.restart{background:#ffab00;}

.menu{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.menu div{
  background:#2a2a2a;
  padding:12px;
  border-radius:10px;
  text-align:center;
}
</style>
</head>

<body>
<div class="overlay">

  <div class="header">🖥 Minecraft Server Panel</div>

  <!-- SERVER INFO -->
  <div class="card">
    <div class="server-name" id="serverName">Server</div>
    <small>Server ID: #AUTO</small><br><br>
    <b>IP:</b> <span id="serverIP">server.HackerVoid</span>

    <input type="text" id="nameInput" placeholder="Change Server Name">
    <button onclick="changeName()">Save Name</button>
  </div>

  <!-- CONTROLS -->
  <div class="card">
    <h3>Server Controls</h3>
    <button class="start">Start</button>
    <button class="stop">Stop</button>
    <button class="restart">Restart</button>
  </div>

  <!-- OPTIONS (ATERNOS STYLE) -->
  <div class="card menu">
    <div>⚙ Options</div>
    <div>📜 Log</div>
    <div>🧑 Players</div>
    <div>🧩 Plugins</div>
    <div>🌍 Worlds</div>
    <div>💾 Backups</div>
    <div>📁 Files</div>
    <div>🧠 Software</div>
  </div>

</div>

<script>
/* LOAD SAVED SERVER NAME */
let saved = localStorage.getItem("serverName");
if(saved){
  document.getElementById("serverName").innerText = saved;
  document.getElementById("serverIP").innerText = saved + ".HackerVoid";
}

/* CHANGE NAME + AUTO IP */
function changeName(){
  let name = document.getElementById("nameInput").value.trim().toLowerCase();
  if(name){
    document.getElementById("serverName").innerText = name;
    document.getElementById("serverIP").innerText = name + ".HackerVoid";
    localStorage.setItem("serverName", name);
  }
}
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Minecraft Hosting</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
    }

    .box {
      text-align: center;
    }

    button {
      padding: 12px 25px;
      margin: 10px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #00ff88;
      color: black;
      font-weight: bold;
    }

    .panel {
      margin-top: 20px;
      padding: 15px;
      background: #111;
      border-radius: 10px;
      display: none;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Minecraft Hosting Live</h1>

    <button onclick="showFree()">Free Server</button>
    <button onclick="showPaid()">Paid Plan</button>

    <div id="freePanel" class="panel">
      <h2>Free Server</h2>
      <p>Limited RAM</p>
      <p>Not 24/7</p>
    </div>

    <div id="paidPanel" class="panel">
      <h2>Paid Plan</h2>
      <p>24/7 Online</p>
      <p>High Performance</p>
    </div>
  </div>

  <script>
    function showFree() {
      document.getElementById("freePanel").style.display = "block";
      document.getElementById("paidPanel").style.display = "none";
    }

    function showPaid() {
      document.getElementById("paidPanel").style.display = "block";
      document.getElementById("freePanel").style.display = "none";
    }
  </script>

</body>
</html>

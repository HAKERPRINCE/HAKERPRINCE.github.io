<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Minecraft Hosting</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: black;
      color: white;
    }

    .container {
      text-align: center;
    }

    h1 {
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    button {
      padding: 12px 25px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #00ff88;
      color: black;
      font-weight: bold;
    }

    button:hover {
      background: #00cc6f;
    }

    .panel {
      display: none;
      margin-top: 30px;
      background: #111;
      padding: 20px;
      border-radius: 10px;
      width: 300px;
    }

    .panel h2 {
      margin-top: 0;
      color: #00ff88;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Minecraft Hosting Live</h1>

    <div class="buttons">
      <button id="freeBtn">Free Server</button>
      <button id="paidBtn">Paid Plan</button>
    </div>

    <!-- FREE SERVER PANEL -->
    <div id="freePanel" class="panel">
      <h2>Free Server</h2>
      <p>✔ Limited RAM</p>
      <p>✔ Not 24/7</p>
      <p>✔ Trial Server</p>
    </div>

    <!-- PAID PLAN PANEL -->
    <div id="paidPanel" class="panel">
      <h2>Paid Plan</h2>
      <p>✔ 24/7 Online</p>
      <p>✔ High RAM & CPU</p>
      <p>✔ Mods & Plugins</p>
    </div>
  </div>

  <script>
    const freeBtn = document.getElementById("freeBtn");
    const paidBtn = document.getElementById("paidBtn");
    const freePanel = document.getElementById("freePanel");
    const paidPanel = document.getElementById("paidPanel");

    freeBtn.onclick = () => {
      freePanel.style.display = "block";
      paidPanel.style.display = "none";
    };

    paidBtn.onclick = () => {
      paidPanel.style.display = "block";
      freePanel.style.display = "none";
    };
  </script>

</body>
</html>

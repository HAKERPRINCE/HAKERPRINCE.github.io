<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Minecraft Hosting Live</title>

<style>
body {
  margin: 0;
  height: 100vh;

  /* 🔹 PEHLE IMAGE */
  background-image: url("./minecraft.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  display: flex;
  justify-content: center;
  align-items: center;

  font-family: Arial, sans-serif;
  color: white;

  transition: background-image 1s ease-in-out;
}

/* dark overlay */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: -1;
}

.main {
  text-align: center;
}

button {
  padding: 15px 25px;
  margin: 10px;
  font-size: 18px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

.free {
  background: #00ff7f;
}

.paid {
  background: #ffb300;
}
</style>
</head>

<body>

<div class="main">
  <h1>Minecraft Hosting Live</h1>

  <button class="free" onclick="openFreePanel()">Free Server</button>
  <button class="paid" onclick="openPaid()">Paid Plan</button>
</div>

<script src="./script.js"></script>
</body>
</html>

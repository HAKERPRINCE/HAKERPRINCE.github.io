<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Server Plan Panel</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    h1 {
      margin-bottom: 20px;
      color: #333;
    }

    .buttons {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
    }

    button {
      padding: 10px 25px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background-color: #6200ea;
      color: #fff;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #4500b5;
    }

    .panel {
      width: 300px;
      min-height: 150px;
      padding: 20px;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      display: none; /* hidden by default */
      text-align: center;
      transition: all 0.4s ease;
    }

    .panel.active {
      display: block;
    }
  </style>
</head>
<body>

  <h1>Select Your Server Plan</h1>

  <div class="buttons">
    <button id="freeBtn">Free Server</button>
    <button id="paidBtn">Paid Plan</button>
  </div>

  <div id="freePanel" class="panel">
    <h2>Free Server</h2>
    <p>512 MB RAM, 0.1 CPU</p>
    <p>$0/month</p>
  </div>

  <div id="paidPanel" class="panel">
    <h2>Paid Plan</h2>
    <p>Choose your plan:</p>
    <ul>
      <li>Starter: 512 MB RAM, $7/month</li>
      <li>Standard: 2 GB RAM, $25/month</li>
      <li>Pro: 4 GB RAM, $85/month</li>
    </ul>
  </div>

  <script>
    const freeBtn = document.getElementById('freeBtn');
    const paidBtn = document.getElementById('paidBtn');
    const freePanel = document.getElementById('freePanel');
    const paidPanel = document.getElementById('paidPanel');

    freeBtn.addEventListener('click', () => {
      freePanel.classList.add('active');
      paidPanel.classList.remove('active');
    });

    paidBtn.addEventListener('click', () => {
      paidPanel.classList.add('active');
      freePanel.classList.remove('active');
    });
  </script>

</body>
</html>
